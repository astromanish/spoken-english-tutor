<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priyanka — live spoken English tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="masthead">
    <p class="eyebrow">Role Playing Spoken English Tutor</p>
    <p class="lede">
      Pick a scenario and press <strong>Start</strong>. Talk whenever you like — half a
      second of quiet hands her the turn. She plays the interviewer, the waiter, the
      doctor, and fixes every mistake in <strong>Hinglish</strong>.
    </p>
  </header>

  <section class="card setup" id="setup">
    <label class="field">
      <span>Scenario</span>
      <select id="topic"></select>
    </label>
    <label class="field">
      <span>Voice</span>
      <select id="voice"></select>
    </label>
    <div class="setup-actions">
      <button id="preview" class="ghost" type="button" disabled>Preview Voice</button>
      <button id="start" class="primary">Start session</button>
    </div>
  </section>

  <section class="card stage" id="stage">
    <div class="stage-head">
      <span id="badge" class="badge">Level · not set yet</span>
      <span id="status" class="status">Idle</span>
    </div>

    <div class="orb-wrap">
      <div class="orb" id="orb" data-state="idle">
        <span class="orb-ring ring-a"></span>
        <span class="orb-ring ring-b"></span>
        <span class="orb-core">
          <span class="bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </span>
      </div>

      <!-- shown only while something is actually happening -->
      <div class="state-pill" id="statePill" hidden>
        <span class="state-ico" aria-hidden="true">
          <svg class="i-ear" viewBox="0 0 24 24">
            <path class="fl" d="M9.8 9.4a2.3 2.3 0 0 1 4.6-.2c0 1.6-1 1.9-1 3.1a1.8 1.8 0 0 1-3.5.7 1.9 1.9 0 0 1-.1-3.6Z"/>
            <path class="st" d="M6.2 9.4a6.2 6.2 0 1 1 12.4-.2c0 5.2-5.4 5.6-5.9 8.8a3.4 3.4 0 0 1-6.3 1.9"/>
            <path class="st" d="M14.4 9.2a2.3 2.3 0 0 0-4.6.2v.9a1.9 1.9 0 1 1 .1 3.8"/>
          </svg>
          <svg class="i-mouth" viewBox="0 0 24 24">
            <path class="st" d="M2.6 10.9c1.6-1.4 3.6-2.1 6-2.1s4.4.7 6 2.1c-1.2 4.3-3.2 6.5-6 6.5s-4.8-2.2-6-6.5Z"/>
            <path class="cav" d="M4.1 11.2c1.5-.8 3-.1 4.5-.1s3-.7 4.5.1c-1.1 3-2.6 4.6-4.5 4.6s-3.4-1.6-4.5-4.6Z"/>
            <path class="teeth" d="M4.6 11.9h8.2"/>
            <path class="wave w1" d="M17.6 9.5a4.6 4.6 0 0 1 0 5.6"/>
            <path class="wave w2" d="M20.4 7.8a8 8 0 0 1 0 9"/>
          </svg>
          <svg class="i-think" viewBox="0 0 24 24">
            <circle class="st ring" cx="12" cy="12" r="7.4"/>
          </svg>
        </span>
        <span id="stateLabel">Listening</span>
      </div>
    </div>

    <div class="captions">
      <p class="cap you">
        <span class="cap-label">You</span>
        <span class="cap-text" id="capYou">—</span>
      </p>
      <p class="cap tutor">
        <span class="cap-label">Priyanka</span>
        <span class="cap-text" id="capTutor">—</span>
      </p>
    </div>

    <div class="controls">
      <button id="mic" class="round" aria-pressed="true" aria-label="Mute microphone"
              title="Mute microphone" disabled>
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true">
          <path class="st" d="M12 3.9a2.9 2.9 0 0 1 2.9 2.9v5a2.9 2.9 0 0 1-5.8 0v-5A2.9 2.9 0 0 1 12 3.9Z"/>
          <path class="st" d="M5.9 11.2a6.1 6.1 0 0 0 12.2 0"/>
          <path class="st" d="M12 17.3v3"/>
        </svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true">
          <path class="st" d="M12 3.9a2.9 2.9 0 0 1 2.9 2.9v5a2.9 2.9 0 0 1-4.4 2.5"/>
          <path class="st" d="M5.9 11.2a6.1 6.1 0 0 0 9.2 5.2"/>
          <path class="st" d="M12 17.3v3"/>
          <path class="st slash" d="M4.7 4 19.3 20"/>
        </svg>
      </button>
      <button id="end" class="ghost" disabled>End · written summary</button>
    </div>

    <p class="metric" id="metric"></p>
    <audio id="player" preload="auto"></audio>
  </section>

  <section id="summaryCard" class="card summary" hidden>
    <h2>Session summary</h2>
    <div id="summary"></div>
  </section>
</main>
<script src="/static/vad.js"></script>
<script src="/static/turns.js"></script>
<script src="/static/wav.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
